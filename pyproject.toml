[project]
name = "omapoker"
version = "0.1.0"
description = "OmaPoker - Texas Hold'em for Omarchy systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85",
    "mutagen>=1.47",
]

[project.optional-dependencies]
identity = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
omapoker = "omapoker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omapoker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: exhaustive verification (run with `pytest -m slow`)",
]
